      string: '{"@context":"http://iiif.io/api/presentation/2/context.json","@type":"sc:Manifest","@id":"https://cdm17217.contentdm.oclc.org/iiif/supreme_court:7076/manifest.json","label":"Gill
        et al. v. Tittle","metadata":[{"label":"Case Number","value":"2566"},{"label":"Location","value":"SC00075"},{"label":"Court
        Term","value":"1848 June"},{"label":"Catalog Record","value":"http://archives-alabama-primo.hosted.exlibrisgroup.com/01ALABAMA:default_scope:01ALABAMA_ALMA215682820002743"},{"label":"Collection
        Creator","value":"Alabama. Supreme Court"},{"label":"Description","value":"A
        transcription is included here, and the case is summarized in Alabama Reports,
        volume 14, pages 528 through 533. Excerpt from the report:\r\n\r\nThe bill
        is filed by the complainants to protect their interest in certain slaves therein
        named, against a threatened injury on the part of the defendant, who has an
        estate for the life of the complainants'' father and mother, and who, the
        plaintiff''s pray, may be required to give security for the forthcoming of
        the slaves after the termination of such estate.\r\n\r\nThe title set up by
        complainants is derived under a deed from one Robert Freeman, which is made
        an exhibit to the bill, and is in the following words:\r\n\r\n\"Georgia, Oglethorpe
        county.\r\n\"To all to whom these presents may come, greeting:   \r\nKnow
        ye, that I, Robert Freeman, of the county and state aforesaid, for, and in
        consideration of the natural love and affection which I have and do bear towards
        the family of children of Joseph Gill, of the county and state aforesaid:
        that is to say, John L . Gill, Lucinda Gill, Marshall M. Gill, and Joseph
        M. Gill, and the heirs that he, the said Joseph Gill, may have by his present
        wife Nancy Gill, if any more there should be; that I do by these presents,
        give and grant to the said family of children, and to the further increase,
        if any, one negro girl Phebe, and her increase, which said negro girl, with
        her increase, if any, at, and after his, the said Gill''s death, and the death
        of his said wife Nancy, the above negro and increase, if any, to be equally
        divided among the whole of the above named children, with the increase of
        the said Nancy''s heirs, of the said Joseph; and I do, for myself, my heirs,
        executors, administrators and assigns, and no further, warrant, and forever
        defend, the aforesaid negro girl Phebe, to the said described heirs of Joseph
        Gill, and their heirs forever. In witness whereof, I have hereunto set my
        hand and seal, this 18th of December, 1812.\r\nRobert Freeman, [seal.]\"\r\n(Signed,
        and duly attested.}\r\n\r\nThe answer of James Tittle, the defendant, avers
        a purchase of the slaves by him from Peter Tittle, who purchased from Joseph
        Gill, the father of the complainants, and demurs to the bill.\r\n\r\n"},{"label":"Division","value":"Northwestern
        Division"},{"label":"Download Transcription","value":"https://archives.alabama.gov/research/docs/collections/supreme-court/SC00075_Gill_v_Tittle_transcription.pdf"},{"label":"Language","value":"English"},{"label":"Repository","value":"Alabama
        Department of Archives and History, 624 Washington Avenue, Montgomery, Alabama
        36130"},{"label":"Rights","value":"This material may be protected under U.
