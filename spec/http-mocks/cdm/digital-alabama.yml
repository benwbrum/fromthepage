        to the material. It is the patron''s obligation to determine and satisfy copyright
        restrictions when publishing or otherwise distributing materials found in
        our collections."},{"label":"Collection Title","value":"Alabama Supreme Court
        case files"},{"label":"Subject - Topics","value":"African Americans; Estates
        (Law); Inheritance and succession; Slavery"},{"label":"Subject - Places","value":"Jefferson
        County (Ala.)"},{"label":"Subject - People","value":"Freeman, Robert; Gill,
