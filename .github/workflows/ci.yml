name: "CI"

on:
  push: {}
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/willnigel23/ftp-ci:latest

    services:
      mysql:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: diary_test
          MYSQL_USER: rails
          MYSQL_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -s http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      MYSQL_ROOT_PASSWORD: password
      MYSQL_HOST: mysql
      ELASTIC_HOST_URL: http://elasticsearch:9200
      ELASTIC_SUFFIX: ci
      GEMINI_API_KEY: redacted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Search for binding.pry
        run: '! grep -R "binding.pry" . --exclude-dir=.git --exclude-dir=.github --exclude-dir=vendor'

      - name: Install Ruby gems
        run: bundle install --jobs 4 --retry 3

      - name: Create database
        run: bundle exec rake db:create

      - name: Migrate database
        run: bundle exec rake db:migrate

      - name: Load fixtures
        run: bundle exec rake db:fixtures:load FIXTURES_PATH=spec/fixtures

      - name: Elasticsearch Initialize
        run: bundle exec rake fromthepage:es:setup:init
        env:
          ELASTIC_ENABLED: true

      - name: Elasticsearch Build Indices
        run: bundle exec rake fromthepage:es:data:build
        env:
          ELASTIC_ENABLED: true

      - name: Elasticsearch Reindex
        run: bundle exec rake fromthepage:es:data:reindex
        env:
          ELASTIC_ENABLED: true

      - name: Run tests
        run: xvfb-run -a bundle exec rspec spec
        env:
          COVERAGE: true
          CI: true
          ELASTIC_ENABLED: false

      - name: Run Coveralls
        if: ${{ (github.event_name == 'pull_request' && github.ref != 'refs/heads/development') || (github.event_name == 'push' && github.ref == 'refs/heads/development') }}
        uses: coverallsapp/github-action@v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./coverage/lcov.info"

  rubocop:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    container:
      image: ghcr.io/willnigel23/ftp-ci:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ruby gems
        run: bundle install --jobs 4 --retry 3

      - name: Run RuboCop
        run: bundle exec rubocop

  solid_queue:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/willnigel23/ftp-ci:latest
    services:
      mysql:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: diary_test
          MYSQL_USER: rails
          MYSQL_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      MYSQL_ROOT_PASSWORD: password
      MYSQL_HOST: mysql
      ELASTIC_ENABLED: false
      ELASTIC_SUFFIX: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ruby gems
        run: bundle install --jobs 4 --retry 3

      - name: Create database
        run: bundle exec rake db:create

      - name: Migrate database
        run: bundle exec rake db:migrate

      - name: Load fixtures
        run: bundle exec rake db:fixtures:load FIXTURES_PATH=spec/fixtures

      - name: Start Solid Queue Workers (CI Test)
        run: |
          bundle exec rails solid_queue:start RAILS_ENV=test &
          WORKER_PID=$!

          sleep 5

          if ! ps -p $WORKER_PID > /dev/null; then
            echo "Solid Queue workers failed to start!"
            exit 1
          fi

          kill $WORKER_PID

  linked_files_warn:
    name: "Warn on linked files changes"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Check for changes in linked files
        run: |
          LINKED_FILES=(
            "config.ru"
            "config/database.yml"
            "config/environments/production.rb"
            "config/initializers/01fromthepage.rb"
            "config/initializers/rack_attack.rb"
            "config/initializers/omniauth.rb"
            "config/newrelic.yml"
            "public/robots.txt"
          )

          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})

          WARN_FILES=()
          for f in "${LINKED_FILES[@]}"; do
            if echo "$CHANGED_FILES" | grep -q "^$f$"; then
              WARN_FILES+=("$f")
            fi
          done

          if [ ${#WARN_FILES[@]} -gt 0 ]; then
            echo "❌ WARNING: The following linked files were changed:"
            for wf in "${WARN_FILES[@]}"; do
              echo "  - $wf"
            done
            exit 1
          else
            echo "✅ No linked files changed."
          fi
