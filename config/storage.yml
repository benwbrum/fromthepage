local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

linode:
  service: S3
  endpoint: <%= ENV['LINODE_ENDPOINT'] %>
  access_key_id: <%= ENV['LINODE_ACCESS_KEY_ID'] %>
  secret_access_key: <%= ENV['LINODE_SECRET_ACCESS_KEY'] %>
  region: default
  bucket: <%= ENV['LINODE_BUCKET'] %>
  public: false
