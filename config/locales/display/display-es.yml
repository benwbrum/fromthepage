      text_only_description: Estadísticas calculadas tras eliminar la puntuación, los espacios en blanco adicionales y normalizar las mayúsculas y minúsculas.
      verbatim_comparison: Comparación literal
      verbatim_description: Estadísticas calculadas sobre el texto original conservando todo el formato.
      word_error_rate: Tasa de error de palabras (WER)
      word_error_rate_tooltip: WER mide el porcentaje de ediciones a nivel de palabra necesarias para transformar el texto generado por IA en la versión correcta. Los valores más bajos indican mayor precisión.
