      character_error_rate: Tasa de error de caracteres (CER)
      character_error_rate_tooltip: CER mide el porcentaje de ediciones a nivel de carácter (inserciones, eliminaciones, sustituciones) necesarias para transformar el texto generado por IA en el texto correcto. Los valores más bajos indican mayor precisión.
      non_stopword_accuracy: Precisión sin palabras vacías (NSA)
      non_stopword_accuracy_tooltip: Mide el porcentaje de palabras de contenido (excluyendo palabras comunes como «el», «la», «un», «es») que coinciden entre la IA y la verdad fundamental. Valores más altos indican un mejor reconocimiento de contenido.
      statistics_unavailable: Las estadísticas de precisión no están disponibles para esta página.
      statistics_unavailable_reason: Las estadísticas solo se pueden calcular para las páginas con transcripción humana.
